# Configuração central. Os três programas leem este arquivo.
# No dia da apresentação só muda o ip_federacao (e a porta, se o professor passar outra).

# Federação: o PC do professor.
ip_federacao = 127.0.0.1
porta_federacao = 9000

# Nosso estado. UF de 0 a 26, em ordem alfabética do nome (0 = AC ... 8 = GO ... 26 = TO),
# porque o identificador só tem 5 bits para o estado.
uf = 8

# Onde o estado atende os municípios por RPC. Nos computadores dos municípios,
# trocar ip_estado pelo IP da máquina onde o estado está rodando.
ip_estado = 127.0.0.1
porta_estado = 9100

# Quanto o estado pede à federação quando começa, e quanto pede de reposição
# quando acaba em um município.
pedido_inicial_consulta = 500
pedido_inicial_vacina = 500
lote_reposicao = 10

# Municípios, na ordem: o primeiro é o 1, o segundo é o 2...
municipio = Goiania
municipio = Aparecida de Goiania
municipio = Anapolis
municipio = Rio Verde
municipio = Luziania
municipio = Aguas Lindas de Goias
municipio = Valparaiso de Goias
municipio = Trindade
municipio = Formosa
municipio = Itaberai
